[package]
name = "xaqu-lode"
description = "lode: the log manager -- the service init starts in a sealed job, and the reader (docs/LOGGING.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "lode"
path = "src/main.rs"
test = false
bench = false

[dependencies]
xaqu-linux-abi.workspace = true
xaqu-lode-capture.workspace = true
xaqu-fat.workspace = true
xaqu-lode-core.workspace = true
xaqu-log-shed.workspace = true
xaqu-native-abi.workspace = true
xaqu-partition.workspace = true
xaqu-rt.workspace = true
# init's control records, for an alert's `start` (docs/LOGGING.md §7.4).
xaqu-svc-proto.workspace = true

# `lode reload`, the settings writer's part in lode (ledger 3623 (R18)): an image whose
# profile has settings_writer = "absent" builds lode without it, and xtask refuses one
# whose lode still holds it.
[features]
default = ["reload"]
reload = []

[lints]
workspace = true
