[package]
name = "xaqu-linuxd"
description = "linuxd: the Linux personality in user space, the load's one source built against the shim (docs/microkernel/M5-LIFT.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "linuxd"
path = "src/main.rs"
test = false
bench = false

[dependencies]
xaqu-kernel-core = { package = "xaqu-lift-core", path = "../../../../kernel/lift/core" }
xaqu-kernel-item = { package = "xaqu-lift-item", path = "../../../../kernel/lift/item" }
xaqu-kernel-load = { package = "xaqu-lift-load", path = "../../../../kernel/lift/load" }
xaqu-native-abi.workspace = true
xaqu-kernel-settings = { package = "xaqu-lift-settings", path = "../../../../kernel/extensions/settings/lift" }
xaqu-kernel-logctl = { package = "xaqu-lift-logctl", path = "../../../../kernel/extensions/device/logctl/lift" }
xaqu-kernel-net-ring = { package = "xaqu-lift-net-ring", path = "../../../../kernel/extensions/device/net-ring/lift" }
xaqu-rt.workspace = true
xaqu-native.workspace = true
xaqu-bootinfo.workspace = true

[lints]
workspace = true
