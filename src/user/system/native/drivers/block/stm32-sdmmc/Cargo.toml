[package]
name = "xaqu-sdmmc"
description = "The STM32MP15 SD card driver process: the block ring's driver end over SDMMC1 and the card in it, on xaqu-rt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sdmmc"
path = "src/main.rs"
