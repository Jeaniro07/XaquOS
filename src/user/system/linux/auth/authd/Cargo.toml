[package]
name = "authd"
description = "/sbin/authd: the one process that holds credentials (docs/AUTH.md §3.2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The socket, its peer's credentials, poll, and dropping to the `auth` user.
libc = "0.2.189"
xaqu-auth-proto = { path = "../../../../../lib/proto/auth-proto" }
xaqu-argon2 = { path = "../../../../../lib/crypto/argon2" }
# The policy files are in the unit files' syntax, read by the same parser.
xaqu-svc = { path = "../../../../../lib/init/svc" }
# The socket helpers the clients use too.
xaqu-auth-client = { path = "../client" }
# The seat channel (docs/AUTH.md §3.7): init's bootstrap, OFFER and CONNECT.
xaqu-native = { path = "../../../../../lib/proto/native" }
xaqu-native-abi = { path = "../../../../../lib/proto/native-abi" }

[lints]
workspace = true
