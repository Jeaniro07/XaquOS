# Yoru's launcher (docs/DESKTOP.md §6, step Y3): fuzzel drawn as the design's
# command palette, a 600-pixel card on the light glass surface at the top of the
# screen, the search glyph in accent-300, the picked row tinted with the
# accent. fuzzel reads it with `--config`; a person's own fuzzel.ini is
# what their own binds start it with.
[main]
font=Inter Variable:size=10.5,Phosphor:size=13
prompt="  "
placeholder=Search apps…
anchor=top
y-margin=150
width=52
lines=9
horizontal-pad=16
vertical-pad=14
inner-pad=10
line-height=30
icons-enabled=yes
match-counter=yes
minimal-lines=yes

[colors]
background=ffffffff
text=3a3a40ff
prompt=0a84ffff
placeholder=8e8e96ff
input=1d1d1fff
match=0a84ffff
selection=0a84ff29
selection-text=1d1d1fff
selection-match=0a6fdcff
counter=8e8e96ff
border=00000024

[border]
width=1
radius=14
selection-radius=8
