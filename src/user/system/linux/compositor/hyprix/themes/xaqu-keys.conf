# Xaqu's keys (docs/DESKTOP.md §6), beside xaqu.conf: `source` it after
# that file on a desktop that has no binds of its own.
#
# SUPER is the Xaqu key (the customer, 2026-10-24: no Alt, so every
# program keeps its Alt and Ctrl keys). A key the desktop's own
# configuration binds already -- run-compositor's SUPER Return for the
# terminal, SUPER Q to close -- is not bound again here, since a key bound
# twice runs both.

# Find, run and switch: Spotlight, the shell's search card, opens on SUPER
# space and runs what it finds. Mission Control, the overview drawn anew --
# a space per workspace, the windows of a space as cards -- opens on SUPER
# Tab; SUPER O opens the classic overview, and SUPER K walks the windows.
bind = SUPER, space, exec, /bin/xaqu-shell --spotlight
bind = SUPER, Tab, mission, toggle
bind = SUPER, K, switcher, next
bind = SUPER SHIFT, K, switcher, prev
bind = SUPER, O, overview, toggle

# Snap: halves, top for the whole screen, down to restore; with SHIFT,
# the focus moves to the neighbour that way.
bind = SUPER, Left, snapwindow, left
bind = SUPER, Right, snapwindow, right
bind = SUPER, Up, snapwindow, max
bind = SUPER, Down, snapwindow, restore
bind = SUPER SHIFT, Left, movefocus, l
bind = SUPER SHIFT, Right, movefocus, r
bind = SUPER SHIFT, Up, movefocus, u
bind = SUPER SHIFT, Down, movefocus, d

# Tabs: a window grouped with the others as tabs, and the tabs walked.
bind = SUPER, G, togglegroup
bind = SUPER, bracketright, changegroupactive, f
bind = SUPER, bracketleft, changegroupactive, b

# Windows.
bind = SUPER, M, minimize
bind = SUPER, W, killactive
# The menu bar's Quit: the focused program's window closed, as Close does
# until a program can be asked to quit whole.
bind = SUPER, Q, killactive

# Suspend the focused program whole, in RAM; SUPER SHIFT Z resumes every
# program suspended (docs/APP-SUSPEND.md §3.1.1).
bind = SUPER, Z, suspend
bind = SUPER SHIFT, Z, resume, all

# The wallpaper switcher (xaqu-shell's); pressed again, it closes.
bind = SUPER, I, exec, /bin/xaqu-shell --walls

# The Launchpad (xaqu-shell's): every installed application on a grid over
# the whole screen.
bind = SUPER, L, exec, /bin/xaqu-shell --launchpad

# The scratchpad: a special workspace dropped over everything.
bind = SUPER, S, togglespecialworkspace, scratch

# Workspaces 1 to 4: code, docs, misc, free.
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER, Next, workspace, e+1
bind = SUPER, Prior, workspace, e-1

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
