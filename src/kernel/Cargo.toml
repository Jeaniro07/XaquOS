[package]
name = "xaqu-kernel"
description = "The Xaqu kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "xaqu-kernel"
path = "src/main.rs"

[dependencies]
xaqu-kernel-load.workspace = true
# The removable run-time setting entries: always compiled, linked only when
# the composition root names them, under runtime_settings=live
# (docs/KERNEL-CRATES.md §6; ledger 3558 (10), 3623 (R1)).
xaqu-kernel-settings.workspace = true
# The board glue, installed by the composition root (docs/microkernel/
# CRATE-SPLIT.md S2).
xaqu-kernel-board-gs201-usb.workspace = true
xaqu-kernel-board-stm32mp1.workspace = true
xaqu-kernel-logctl.workspace = true
xaqu-kernel-net-ring.workspace = true
xaqu-linux-abi.workspace = true
xaqu-bootinfo.workspace = true
xaqu-crng.workspace = true
xaqu-elf.workspace = true
xaqu-paging.workspace = true
xaqu-sched.workspace = true
xaqu-smbios.workspace = true
xaqu-sync.workspace = true
xaqu-ustack.workspace = true

[lints]
workspace = true
