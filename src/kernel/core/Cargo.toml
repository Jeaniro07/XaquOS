[package]
name = "xaqu-kernel-core"
description = "The Xaqu kernel's core ring: what every other part rests on"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# The one build script of the kernel's crates: the build flags as cfgs
# (docs/BUILD-FLAGS.md rule 6 b, docs/KERNEL-CRATES.md).
build = "../build.rs"

# The crate root sits beside the binary's main.rs, so that its modules are
# found where every kernel file is today (docs/KERNEL-CRATES.md).
[lib]
path = "../src/kernel_core.rs"

[dependencies]
xaqu-acpi.workspace = true
xaqu-audit.workspace = true
xaqu-bootinfo.workspace = true
xaqu-cgroupfs.workspace = true
