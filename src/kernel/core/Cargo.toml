xaqu-fallible.workspace = true
xaqu-fbtext.workspace = true
xaqu-fdt.workspace = true
xaqu-frame.workspace = true
xaqu-heap.workspace = true
xaqu-kmem.workspace = true
xaqu-sha256.workspace = true
xaqu-linux-abi.workspace = true
xaqu-native-abi.workspace = true
xaqu-objects.workspace = true
xaqu-paging.workspace = true
xaqu-pci.workspace = true
xaqu-qr.workspace = true
xaqu-sched.workspace = true
xaqu-sched-edf.workspace = true
xaqu-sync.workspace = true
xaqu-vdso.workspace = true
xaqu-vfs.workspace = true
xaqu-vma.workspace = true

