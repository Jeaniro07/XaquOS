[package]
name = "xaqu-kernel-net-ring"
description = "The Xaqu kernel's end of a network driver's ring (xaqu-netring): a load-ring part"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# The one build script of the kernel's crates: the build flags as cfgs
# (docs/BUILD-FLAGS.md rule 6 b, docs/KERNEL-CRATES.md).
build = "../../../build.rs"

# An optional part (docs/microkernel/CRATE-SPLIT.md §2.1, S4): its modules
# under src/ at the module path they had in src/kernel/src
# (interfaces::net_ring). Its lift twin, lift/, builds the same root for
# linuxd. It names the load (net, block_ring::location_of, the devmgr's
# publication), the one edge §2.3 allows a part.
[lib]
path = "src/lib.rs"

[dependencies]
xaqu-kernel-core.workspace = true
xaqu-kernel-load.workspace = true
xaqu-blkring.workspace = true
xaqu-bootinfo.workspace = true
xaqu-linux-abi.workspace = true
xaqu-native-abi.workspace = true
xaqu-net.workspace = true
xaqu-netring.workspace = true
xaqu-netwire.workspace = true
xaqu-sched.workspace = true

[lints]
workspace = true
