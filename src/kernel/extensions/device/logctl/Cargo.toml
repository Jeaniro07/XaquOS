[package]
name = "xaqu-kernel-logctl"
description = "The Xaqu kernel's end of the kernel log's control channel (xaqu-logctl): a load-ring part"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# The one build script of the kernel's crates: the build flags as cfgs
# (docs/BUILD-FLAGS.md rule 6 b, docs/KERNEL-CRATES.md).
build = "../../../build.rs"

# An optional part (docs/microkernel/CRATE-SPLIT.md §2.1, S3): its modules
# under src/ at the module path they had in src/kernel/src
# (interfaces::logctl). Its lift twin, lift/, builds the same root for linuxd.
[lib]
path = "src/lib.rs"

[dependencies]
xaqu-kernel-core.workspace = true
xaqu-kernel-item.workspace = true
xaqu-blkring.workspace = true
xaqu-linux-abi.workspace = true
xaqu-logctl.workspace = true
xaqu-native-abi.workspace = true
xaqu-sched.workspace = true

[lints]
workspace = true
