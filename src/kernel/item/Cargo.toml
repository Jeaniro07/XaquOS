[package]
name = "xaqu-kernel-item"
description = "The Xaqu kernel's item ring above the core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# The one build script of the kernel's crates: the build flags as cfgs
# (docs/BUILD-FLAGS.md rule 6 b, docs/KERNEL-CRATES.md).
build = "../build.rs"

# The crate root sits beside the binary's main.rs, so that its modules are
# found where every kernel file is today (docs/KERNEL-CRATES.md).
[lib]
path = "../src/kernel_item.rs"

[dependencies]
xaqu-kernel-core.workspace = true
xaqu-audit.workspace = true
xaqu-blkring.workspace = true
xaqu-bootinfo.workspace = true
xaqu-crng.workspace = true
xaqu-devmgr-proto.workspace = true
xaqu-elf.workspace = true
xaqu-fdt.workspace = true
xaqu-linux-abi.workspace = true
xaqu-native-abi.workspace = true
xaqu-objects.workspace = true
xaqu-paging.workspace = true
xaqu-pci.workspace = true
xaqu-sched.workspace = true
xaqu-smbios.workspace = true
xaqu-sync.workspace = true
xaqu-cpio.workspace = true
xaqu-partition-desc.workspace = true
xaqu-vfs.workspace = true
xaqu-virtio.workspace = true
xaqu-vma.workspace = true

[lints]
workspace = true
