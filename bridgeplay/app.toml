# bridgeplay, an app (docs/APPS.md): the launcher for Steam and Windows
# programs. It starts nothing it cannot find: with the Steam or Wine volume
# missing it says so and leaves with a failure, it never crashes.

[package]
name = "bridgeplay"
version = "0.1.0"
description = "Open Steam and Windows programs on Ferrix, through Wine"
license = "MIT"
abi = "linux"
arches = ["x86_64"]
depends = []

[[package.files]]
from = "bridgeplay"
to = "bin/bridgeplay"
mode = "755"

[[package.files]]
from = "share/bridgeplay.desktop"
source = "folder"
to = "usr/share/applications/bridgeplay.desktop"
mode = "644"

[[package.files]]
from = "share/bridgeplay.svg"
source = "folder"
to = "usr/share/icons/hicolor/scalable/apps/bridgeplay.svg"
mode = "644"

[build]
kind = "cargo"

[image]
default = true

[check]
host-tests = true

[[smoke]]
run = "bridgeplay --version"
expect = "bridgeplay 0.1.0"

# No Steam or Wine volume in the smoke image: a clear report, not a crash.
[[smoke]]
run = "bridgeplay doctor"
expect = "bridgeplay doctor"
