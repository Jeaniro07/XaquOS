[package]
name = "xaqu-ahci-driver"
description = "The AHCI driver process: the block ring's driver end over the first SATA disk of an AHCI controller, on xaqu-rt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ahci"
path = "src/main.rs"
test = false
bench = false

[dependencies]
xaqu-ahci.workspace = true
xaqu-blkring.workspace = true
xaqu-blkserve.workspace = true
xaqu-driver = { workspace = true, features = ["block"] }
xaqu-native-abi.workspace = true
xaqu-rt.workspace = true
xaqu-virtio-blk.workspace = true

[lints]
workspace = true
