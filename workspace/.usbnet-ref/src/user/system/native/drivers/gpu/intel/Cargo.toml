[package]
name = "xaqu-intel-driver"
description = "The Intel Xe-LP GPU's driver process (the N150's ADL-N): forcewake, the GT's identity and the GGTT read, then execlist submission (M2) and the i915 render node over the GT (M3), on xaqu-rt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "intel"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "intel-keeper"
path = "src/keeper/main.rs"
test = false
bench = false

[dependencies]
xaqu-blkring.workspace = true
xaqu-chardevctl.workspace = true
xaqu-display-modes.workspace = true
xaqu-displayctl.workspace = true
xaqu-intel-xelp.workspace = true
xaqu-linux-abi.workspace = true
xaqu-native-abi.workspace = true
xaqu-process-builder.workspace = true
xaqu-rt.workspace = true

[lints]
workspace = true
